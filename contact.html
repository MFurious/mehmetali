<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <h1 class="logo"><a href="index.html">Mehmet Ali'nin Blogu</a></h1>
  </div>
</header>

<main class="container">
  <h2>İletişim</h2>
  <p>E-posta: <strong>ornek@ornek.com</strong> (Bunu kendi e-postanla değiştir)</p>

  <h3>Basit iletişim formu (sadece görsel, çalışmaz — çalışmasını istersen söyle)</h3>
  <form>
    <label for="name">İsim</label><br>
    <input id="name" name="name" type="text" placeholder="Adın"><br><br>

    <label for="email">E-posta</label><br>
    <input id="email" name="email" type="email" placeholder="mail@ornek.com"><br><br>

    <label for="message">Mesaj</label><br>
    <textarea id="message" name="message" rows="5" placeholder="Mesajın"></textarea><br><br>

    <button type="submit">Gönder</button>
  </form>
</main>

<footer class="footer">
  <p>© 2025 Mehmet Ali ORHAN</p>
</footer>

</body>
</html>
